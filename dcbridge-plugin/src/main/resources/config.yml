discord:
  token: ""          # REQUIRED, paste your bot token here

  # Filled automatically by /whitelist-setup 
  guild-id: ""
  channels:
    whitelist: ""
    whitelist-log: ""
    whitelist-queue: ""
  roles:
    whitelist: ""
    whitelist-admin: ""
  authorized-user-id: ""

# Whitelist behaviour
whitelist:
  username-min: 3
  username-max: 16
  mode: strict               # strict = exact match; loose = case-insensitive
  geyser-prefix: "."
  deny-message: "&cYou are not whitelisted. Verify on our Discord first!"
  allow-message: "&aWelcome back! You are whitelisted."
  # Both settings below can also be toggled live in Discord with /whitelist settings, no restart needed.
  auto-accept: false         # true = requests are approved immediately, skipping the review queue
  single-submission: false   # true = a user can't submit again while they have a pending/approved request

# Discord message templates
messages:
  form-title: "Whitelist Verification"
  platform-label: "Platform: Java or Bedrock?"
  platform-placeholder: "Java or Bedrock"
  username-label: "Minecraft Username"
  username-placeholder: "Your exact in-game username"
  embed-title: "Server Whitelist Verification"
  embed-description: "Click the button below to verify and get whitelisted."
  embed-footer: "DCbridge Whitelist"
  verify-button: "Click here to verify and get whitelisted"
  done-button: "Done"
  cancel-button: "Deny"
  revoke-button: "Revoke"
  submitted-dm: "Your whitelist request for {username} ({platform}) has been submitted and is pending review."
  queue-dm: "Your whitelist request for {username} ({platform}) is now in the review queue."
  approved-dm: "Your whitelist request for {username} ({platform}) has been approved! You now have the whitelist role."
  denied-dm: "Your whitelist request for {username} ({platform}) was denied."
  revoked-dm: "Your whitelist request for {username} ({platform}) has been revoked."

# Admin tools 
admin:
  remove-keywords: "remove ts,delete ts"
  user-remove-keywords: "user remove ts"
  auto-delete-seconds: 5

# Storage 
data:
  sqlite-file: "whitelist.db"
