discord:
  token: ""
  client-id: ""
  guild-id: ""
  channels:
    whitelist: ""
    whitelist-log: ""
    whitelist-queue: ""
  roles:
    whitelist: ""
    whitelist-admin: ""
  authorized-user-id: ""

server:
  name: ValoriaMC
  java-ip: valoriasmp.playwithbao.com
  bedrock-ip: valoriasmp.playwithbao.com
  java-port: 30418
  bedrock-port: 30418

stats:
  embed-interval-seconds: 30
  color-online: "b6cdff"
  color-offline: "ff6b6b"
  gif-url: "https://media.giphy.com/media/v1.../giphy.gif"

presence:
  update-interval-seconds: 20
  offline-text: "Server Offline 🔴"
  offline-activity-type: WATCHING
  format: "{emoji} {name} | {online}/{max} Players | {ping}ms"
  sub-servers:
    - name: Survival
      emoji: "🌲"

whitelist:
  username-min: 3
  username-max: 16
  mode: strict
  geyser-prefix: "."
  deny-message: "&cYou are not whitelisted. Verify on our Discord first!"
  allow-message: "&aWelcome back! You are whitelisted."

messages:
  form-title: "Whitelist Verification"
  platform-label: "Platform: Java or Bedrock?"
  platform-placeholder: "Java or Bedrock"
  username-label: "Minecraft Username"
  username-placeholder: "Your exact in-game username"
  embed-title: "Server Whitelist Verification"
  embed-description: "Click the button below to verify and get whitelisted..."
  embed-footer: "DCbridge Whitelist"
  verify-button: "Click here to verify and get whitelisted"
  done-button: "Done"
  cancel-button: "Cancel"
  approved-dm: "Your whitelist request for {username} ({platform}) has been approved!"
  denied-dm: "Your whitelist request for {username} ({platform}) was denied."

admin:
  remove-keywords: "remove ts,delete ts"
  user-remove-keywords: "user remove ts"
  auto-delete-seconds: 5

data:
  sqlite-file: "whitelist.db"
  stats-file: "stats.json"
