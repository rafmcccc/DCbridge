name: DCbridge
main: dev.dcbridge.dcbridge.DCbridgePlugin
version: 1.0.0
api-version: '1.21'
authors: [rafmcccc]
description: Discord bot and whitelist plugin embedded into Paper.
commands:
  whitelist-setup:
    description: Post the whitelist verification embed.
    usage: /whitelist-setup
    permission: dcbridge.admin
  status:
    description: Manage the live server status embed.
    usage: /status setup|remove
    permission: dcbridge.admin
  wl-remove:
    description: Revoke a player's whitelist by username.
    usage: /wl-remove <username>
    permission: dcbridge.admin
