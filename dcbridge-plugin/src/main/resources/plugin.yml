name: DCbridge
main: dev.dcbridge.dcbridge.DCbridgePlugin
version: 3.1.0
api-version: '1.21'
authors: [rafmcccc]
description: Discord bot and whitelist plugin embedded into Paper.
commands:
  dcbridge-setup:
    description: "Console/OP command to set the bot token. Usage: /dcbridge-setup token <TOKEN>"
    usage: /dcbridge-setup token <TOKEN>
    permission: dcbridge.admin
  wl-remove:
    description: Revoke a player's whitelist by username.
    usage: /wl-remove <username>
    permission: dcbridge.admin
